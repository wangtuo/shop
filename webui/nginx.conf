# Shop WebUI —— 同源静态站点 + 网关反代
# 网关 JVM 运行在宿主机:8080，容器经 host.docker.internal 回连（Docker Desktop Mac）
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  upstream shop_gateway {
    server host.docker.internal:8080;
    keepalive 16;
  }

  server {
    listen 8000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 入口 HTML：不缓存，保证永远拿到最新资源引用
    location = /index.html {
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # 零构建站点文件名不带内容 hash：JS/CSS 每次用 ETag 协商（304 成本极低），
    # 避免改动后浏览器继续吃 7 天长缓存里的旧版本
    location ~* ^/assets/.*\.(js|css)$ {
      add_header Cache-Control "no-cache";
      try_files $uri =404;
    }

    # 图片/字体等不变资源可长缓存
    location /assets/ {
      expires 7d;
      add_header Cache-Control "public, max-age=604800";
      try_files $uri =404;
    }

    # 业务 API：同源反代，规避浏览器 CORS
    location /api/ {
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_pass http://shop_gateway;
      proxy_connect_timeout 3s;
      proxy_read_timeout 30s;
    }

    # SPA history fallback（hash 路由其实用不上，保险）
    location / { try_files $uri $uri/ /index.html; }
  }
}
