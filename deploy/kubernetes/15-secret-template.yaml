# 生产 Secret 模板（字段清单 + 占位符）。
#
# 本文件【绝不】随 `kubectl apply -f deploy/kubernetes/` 下发：
#   1) 占位符 CHANGE_ME_* 会被 prod profile 的 SecretStrength fail-fast 拦截，镜像无法启动；
#   2) GitOps/流水线对 Secret 的整体 apply 会用占位符静默覆盖已轮换的真实密钥。
#
# 正确姿势（任选其一，值由密管/KMS 注入环境变量，禁止落盘、禁止提交真实值）：
#   bash deploy/kubernetes/create-secrets.sh           # 从环境变量创建，已存在则拒绝覆盖
#   kubectl -n shop create secret generic shop-infra-secret \
#     --from-literal=mysql-password="$MYSQL_PASSWORD" ...   # 人工一次性引导
#
# 字段（13 个，缺字段会导致对应服务 prod 启动 fail-fast）：
#   mysql-username / mysql-password : 业务库账号（最小权限，仅 7 个业务库 DML/DDL 分离更佳）
#                                     Pod 内以环境变量 SHOP_DB_USER / SHOP_DB_PASSWORD 注入
#                                     （application.yml 占位 ${SHOP_DB_USER:root} 等）
#   redis-password                  : Redis AUTH 口令；Pod 内注入为 SHOP_REDIS_PASSWORD
#                                     （占位 ${SHOP_REDIS_PASSWORD:}，prod 必填）
#   jwt-secret                       : JWT HMAC 密钥，>=32 字节随机（Pod: SHOP_JWT_SECRET）
#   internal-token                   : 服务间 Feign X-Internal-Token，独立随机值（SHOP_INTERNAL_TOKEN）
#   data-enc-key                     : 银行卡等敏感字段 AES 密钥（32 字节），由 KMS 托管
#   admin-bootstrap-token            : 首个平台账号引导令牌；生产留空 ""（引导功能关闭）
#   pay-mock-{wechat,alipay,bank,uqr,huabei,baitiao}-secret :
#                                      六渠道 HMAC 密钥；接真实渠道后由对应渠道密管替换
# prod 基线开关 SHOP_SECURITY_REQUIRE_ENV_SECRETS / SHOP_SECURITY_REQUIRE_ENV_DB=true
# 见 00-namespace-config.yaml：DB 口令为空/root/<8 位时 framework 拒绝启动。
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-infra-secret
  namespace: shop
  annotations:
    # 防止误 apply：模板声明自身为 template；create-secrets.sh 创建的真实 Secret 不带此注解
    shop.example.com/secret-template: "do-not-apply"
type: Opaque
stringData:
  mysql-username: "CHANGE_ME"
  mysql-password: "CHANGE_ME"
  redis-password: "CHANGE_ME_REDIS_PASSWORD"
  jwt-secret: "CHANGE_ME_TO_A_LONG_RANDOM_SECRET_AT_LEAST_32_BYTES"
  internal-token: "CHANGE_ME_TO_A_LONG_RANDOM_INTERNAL_TOKEN"
  data-enc-key: "CHANGE_ME_32_BYTES_DATA_ENCRYPT_KEY"
  admin-bootstrap-token: ""
  pay-mock-wechat-secret: "CHANGE_ME_WECHAT_CHANNEL_SECRET"
  pay-mock-alipay-secret: "CHANGE_ME_ALIPAY_CHANNEL_SECRET"
  pay-mock-bank-secret: "CHANGE_ME_BANK_CHANNEL_SECRET"
  pay-mock-uqr-secret: "CHANGE_ME_UQR_CHANNEL_SECRET"
  pay-mock-huabei-secret: "CHANGE_ME_HUABEI_CHANNEL_SECRET"
  pay-mock-baitiao-secret: "CHANGE_ME_BAITIAO_CHANNEL_SECRET"
