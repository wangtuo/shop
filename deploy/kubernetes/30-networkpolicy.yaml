# NetworkPolicy（R-K8S：先 audit / 只记录，不硬阻断，避免 kind 单节点装强制 CNI 后断联）
#
# 为什么默认策略不选中 Pod：
#   原生 networking.k8s.io/v1 NetworkPolicy 没有 audit 模式——只要 policy 选中某 Pod，
#   规则立即强制。kind 默认 CNI（kindnetd）不实现策略，下发为空操作；但为兼容装了
#   Calico/其他强制 CNI 的 kind（含单节点）与直接复用本文件的生产集群，本文件【唯二
#   生效对象】只选择不存在的标签 np-audit=true，选中数恒为 0：等同只记录意图、零阻断。
#
# 强制策略升级路径（W7 通过后由总控执行）：
#   1) 在【多节点 + 强制 CNI】集群跑通 ha-check.sh 全绿与 deploy/loadtest/chaos.sh；
#   2) 解开本文件后半部注释模板（或把 audit selector 换成真实 app 标签）灰度，
#      先 Ingress 后 default-deny + Egress，逐条对照连接被拒日志收敛白名单；
#   3) kind 上验证强制行为：ENFORCE_NETWORKPOLICY=1 bash ha-check.sh
#      （额外下发 kind/40-kind-networkpolicy.yaml 覆盖层；单节点 + 强制 CNI 可能断联，
#      默认关闭）。
#
# §A 残留（托管中间件落地前禁止启用 egress 默认拒绝）：
#   中间件地址经 shop-infra-config 注入（MYSQL_HOST / REDIS_HOST /
#   ROCKETMQ_ENDPOINTS / NACOS_ADDR），生产位于 shop-infra 命名空间或托管 VPC。
#   下方 egress 模板里的命名空间标签、ipBlock CIDR、TLS 端口均为占位，必须按真实
#   拓扑替换并验证后才能放开强制。
---
# ============ 生效对象：零选中审计标记（任何 CNI 下均无阻断效果） ============
# 期望的「业务入站」策略占位：正式规则见文末模板 audit→enforce 第 1 步。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-backend-ingress
  namespace: shop
  annotations:
    shop.network/audit: "record-only"
spec:
  podSelector:
    matchLabels: { np-audit: "true" }   # 无 Pod 携带：选中数=0，等同仅记录意图
  policyTypes:
    - Ingress
  ingress: []
---
# 期望的「默认拒绝入站+出站」策略占位：与白名单配套，禁止单独先于白名单启用。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: audit-default-deny-all
  namespace: shop
  annotations:
    shop.network/audit: "record-only"
spec:
  podSelector:
    matchLabels: { np-audit: "true" }
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress: []
