# kind 本地 HA 验收专用 Secret（开发值，禁止用于生产）。
#
# 与生产 Secret 同样不做「每次 apply 覆盖」：ha-check.sh 仅在 Secret 不存在时创建
# （kubectl get || kubectl apply），避免重复验收把人工改过的值冲掉。
#
# 所有值均刻意不等于代码内置默认，以通过 prod profile fail-fast 校验。
#
# DB 账号不复用 root/root：prod fail-fast（R-Z2）会拒绝弱口令/root。
# kind 验收使用专用应用账号 shop_app（强口令），由
# deploy/mysql/20-kind-app-user.sql 幂等创建并授予七个 shop_* 库；
# root 仅保留给本地运维/迁移，与生产「最小权限应用账号」口径一致。
---
apiVersion: v1
kind: Secret
metadata:
  name: shop-infra-secret
  namespace: shop
type: Opaque
stringData:
  mysql-username: "shop_app"
  mysql-password: "K1nd-ShopApp-2026!x9"
  jwt-secret: "local-kind-dev-jwt-secret-key-0123456789abcdef"
  # 服务间 Feign 内部令牌：kind 专用值，刻意不等于内置默认（prod 启动 fail-fast 校验）。
  internal-token: "kind-ha-internal-token-do-not-use-in-prod-2026"
  # 敏感字段 AES 加密密钥（32 字节 kind 专用，非内置默认值）
  data-enc-key: "0123456789abcdef0123456789abcdef"
  # 平台引导：kind 验收开放一次性引导（生产清单留空关闭）
  admin-bootstrap-token: "kind-local-only-bootstrap-token"
  # 六渠道 HMAC 密钥：kind 验收专用，均不等于代码内置 mock_*_secret_2026
  pay-mock-wechat-secret: "kind-ha-mock-wechat-secret-2026-0001"
  pay-mock-alipay-secret: "kind-ha-mock-alipay-secret-2026-0002"
  pay-mock-bank-secret: "kind-ha-mock-bank-secret-2026-0003"
  pay-mock-uqr-secret: "kind-ha-mock-uqr-secret-2026-0004"
  pay-mock-huabei-secret: "kind-ha-mock-huabei-secret-2026-0005"
  pay-mock-baitiao-secret: "kind-ha-mock-baitiao-secret-2026-0006"
