          # 通过前 liveness/readiness 不参与判定，避免启动期误杀
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8086 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8086 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8086 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "500m", memory: 768Mi }
            # JVM MaxRAMPercentage=60%（约 1.2Gi 堆）+ Metaspace/直接内存/栈，RSS 留足余量
            limits: { cpu: "2", memory: 2Gi }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: shop-settlement-service-pdb
  namespace: shop
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: shop-settlement-service }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: shop-settlement-service-hpa
  namespace: shop
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: shop-settlement-service
  minReplicas: 2
  maxReplicas: 3
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
      # 内存阈值 85%（相对 request=768Mi，触发线≈653Mi）：kind 单节点实测稳态 RSS
      # ≈500-580Mi（=request 的 61-74%），原 70% 阈值在无流量时也恒触发扩容，曾把
      # 单节点内存请求推到 99% 导致 surge Pod 全部 Pending、滚动发布死锁。触发线
      # 653Mi 仅为 2Gi limit 的 32%，距 OOMKill 仍有 1.35Gi 余量；流量扩容由 CPU 65% 兜底
    - type: Resource
      resource:
        name: memory
        target: { type: Utilization, averageUtilization: 85 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-aftersale-service
  namespace: shop
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  minReadySeconds: 15
  selector:
    matchLabels: { app: shop-aftersale-service }
  template:
    metadata:
      labels: { app: shop-aftersale-service }
    spec:
      # R-K8S 硬化：非 root（镜像内 USER 10001:10001）、非零 fsGroup、seccomp RuntimeDefault
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # 只读根文件系统的可写出口：/tmp、heapdump 目录、/app/logs（Nacos/RocketMQ 客户端
      # 默认向 user.home/logs 落文件）。W7 需逐服务 smoke 确认无其他相对路径写文件点（§B-5 残留）。
      volumes:
        - { name: tmp, emptyDir: {} }
        - { name: heapdump, emptyDir: {} }
        - { name: logs, emptyDir: {} }
      # 优雅停机窗口：preStop 10s（等 Endpoint/Ingress/Nacos 端点传播）+ JVM graceful 30s，60s 封顶
      terminationGracePeriodSeconds: 60
      # 生产硬反亲和：同一服务副本必须分布在不同节点（单节点 kind 验收由 ha-check 打补丁放宽）
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels: { app: shop-aftersale-service }
              topologyKey: kubernetes.io/hostname
      # 主机维度硬性打散；可用区维度尽量打散（单可用区集群降级为尽力而为，不阻塞调度）
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: shop-aftersale-service }
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: shop-aftersale-service }
      containers:
        - name: app
          image: registry.example.com/shop/shop-aftersale-service:2.0.0
          imagePullPolicy: IfNotPresent
          # R-K8S 硬化：禁提权、drop ALL capabilities、只读根文件系统
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
            - { name: heapdump, mountPath: /tmp/heapdump }
            - { name: logs, mountPath: /app/logs }
          ports:
            - containerPort: 8087
          lifecycle:
            preStop:
              exec:
                # SIGTERM 前先睡：让 kube-proxy iptables / ingress / Nacos 先摘流量，
                # 随后 JVM 以 1 号进程收到 SIGTERM 走 graceful shutdown（见 Dockerfile exec）
                command: ["sh", "-c", "sleep 10"]
          env:
            - { name: SPRING_CLOUD_NACOS_DISCOVERY_SERVER_ADDR, valueFrom: { configMapKeyRef: { name: shop-infra-config, key: NACOS_ADDR } } }
            - { name: SPRING_CLOUD_NACOS_DISCOVERY_NAMESPACE, valueFrom: { configMapKeyRef: { name: shop-infra-config, key: NACOS_NS } } }
            - { name: SPRING_CLOUD_NACOS_DISCOVERY_GROUP, valueFrom: { configMapKeyRef: { name: shop-infra-config, key: NACOS_GROUP } } }
            - { name: SPRING_CLOUD_SENTINEL_TRANSPORT_DASHBOARD, valueFrom: { configMapKeyRef: { name: shop-infra-config, key: SENTINEL_DASHBOARD } } }
            # §A(R-K8S) useSSL 占位：dev/kind=false；托管 MySQL 地址与 TLS 落地后由 W1-D 在
            # shop-infra-config 注入 SHOP_DB_USE_SSL=true（同步评估 Redis/RMQ/Nacos TLS 占位键）
            - { name: SHOP_DB_USE_SSL, value: "false" }
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:mysql://$(MYSQL_HOST)/shop_aftersale?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=$(SHOP_DB_USE_SSL)&allowPublicKeyRetrieval=true" }
            - { name: SPRING_DATA_REDIS_HOST, valueFrom: { configMapKeyRef: { name: shop-infra-config, key: REDIS_HOST } } }
            - { name: SHOP_MQ_ENDPOINTS, valueFrom: { configMapKeyRef: { name: shop-infra-config, key: ROCKETMQ_ENDPOINTS } } }
            - { name: SPRING_DATASOURCE_USERNAME, valueFrom: { secretKeyRef: { name: shop-infra-secret, key: mysql-username } } }
            - { name: SPRING_DATASOURCE_PASSWORD, valueFrom: { secretKeyRef: { name: shop-infra-secret, key: mysql-password } } }
            - { name: SHOP_JWT_SECRET, valueFrom: { secretKeyRef: { name: shop-infra-secret, key: jwt-secret } } }
            - { name: SHOP_INTERNAL_TOKEN, valueFrom: { secretKeyRef: { name: shop-infra-secret, key: internal-token } } }
            - { name: SHOP_DATA_ENC_KEY, valueFrom: { secretKeyRef: { name: shop-infra-secret, key: data-enc-key } } }
            - { name: SPRING_PROFILES_ACTIVE, value: "prod" }
          envFrom:
            - configMapRef: { name: shop-infra-config }
          # startupProbe 承担慢启动（最多 24*5s=120s，覆盖 MQ 消费者收敛）；
          # 通过前 liveness/readiness 不参与判定，避免启动期误杀
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8087 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8087 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "500m", memory: 768Mi }
            # JVM MaxRAMPercentage=60%（约 1.2Gi 堆）+ Metaspace/直接内存/栈，RSS 留足余量
            limits: { cpu: "2", memory: 2Gi }
