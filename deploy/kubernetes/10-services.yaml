            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8084 }
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8084 }
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: { cpu: "500m", memory: 768Mi }
            # JVM MaxRAMPercentage=60%（约 1.2Gi 堆）+ Metaspace/直接内存/栈，RSS 留足余量
            limits: { cpu: "2", memory: 2Gi }
