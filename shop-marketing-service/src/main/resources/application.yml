server:
  port: 8083
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s  # 优雅停机：在途请求/MQ 消费/事务最长等待
  application:
    name: shop-marketing-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/shop_marketing?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    username: ${SHOP_DB_USER:root}
    password: ${SHOP_DB_PASSWORD:root}
    type: com.alibaba.druid.pool.DruidDataSource
  data:
    redis:
      host: localhost
      port: 6379
      database: 2
      password: ${SHOP_REDIS_PASSWORD:}
      timeout: 3000ms
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
    sentinel:
      eager: true
      transport:
        dashboard: localhost:8858

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-aliases-package: com.shop.marketing.domain
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

shop:
  internal:
    # 服务间 Feign 调用共享密钥（X-Internal-Token）；prod profile 下禁止使用默认值，启动 fail-fast
    token: ${SHOP_INTERNAL_TOKEN:dev-local-only-internal-token}
  jwt:
    secret: ${SHOP_JWT_SECRET:dev-local-only-jwt-secret-key-0123456789abcdef}
    ttl-hours: 168
  mq:
    enabled: true
    endpoints: localhost:8081

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

---
# 生产环境（--spring.profiles.active=prod）：关闭在线 API 文档，避免接口结构外泄（M-4）；
# JWT 密钥/服务间令牌必须环境注入，使用内置默认值将 fail-fast（H-3/C-1）。
spring:
  config:
    activate:
      on-profile: prod
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
